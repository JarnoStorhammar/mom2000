name: CI – Unit Tests & Lint

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ruff
        run: pip install "ruff>=0.4"

      - name: Run ruff
        run: ruff check services/ shared/ tests/ --output-format=github

  # --------------------------------------------------------------------------
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends             libgl1 libglib2.0-0             portaudio19-dev             libopenblas-dev

      - name: Install test dependencies
        run: pip install -r tests/requirements-test.txt

      - name: Install service stubs
        run: |
          pip install             opencv-python-headless             sounddevice             pyyaml             fastapi             uvicorn

      - name: Write face_recognition stub
        run: |
          SITE=$(python -c "import site; print(site.getsitepackages()[0])")
          cat > "$SITE/face_recognition.py" << 'EOF'
          def face_locations(*a, **kw): return []
          def face_encodings(*a, **kw): return []
          def face_distance(*a, **kw): return [1.0]
          def load_image_file(p): return None
          EOF

      - name: Write ultralytics stub
        run: |
          SITE=$(python -c "import site; print(site.getsitepackages()[0])")
          cat > "$SITE/ultralytics.py" << 'EOF'
          class YOLO:
              def __init__(self, *a, **kw): pass
              def __call__(self, *a, **kw): return []
          EOF

      - name: Run pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/             -v             --tb=short             --cov=services             --cov=shared             --cov-report=term-missing             --cov-report=xml:coverage.xml             -p no:cacheprovider

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

      - name: Upload coverage XML artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  # --------------------------------------------------------------------------
  docker-build:
    name: Docker build – ${{ matrix.service }}
    runs-on: ubuntu-22.04
    needs: test
    strategy:
      matrix:
        service: [face_service, vision_service, automation_service, web_ui]

    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.service }}
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build             --no-cache             --build-arg BUILDKIT_INLINE_CACHE=1             -t ha_${{ matrix.service }}:ci             ./services/${{ matrix.service }}
