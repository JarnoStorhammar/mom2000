[tool.pytest.ini_options]
testpaths     = ["tests"]
python_files  = ["test_*.py"]
python_classes= ["Test*"]
python_functions = ["test_*"]
addopts       = "-v --tb=short --cov=services --cov=shared --cov-report=term-missing --cov-report=xml:coverage.xml"

[tool.coverage.run]
source = ["services", "shared"]
omit   = ["*/Dockerfile", "*/__pycache__/*", "*/test_*"]

[tool.coverage.report]
fail_under = 75

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.per-file-ignores]
"tests/*" = ["F401", "S101"]
